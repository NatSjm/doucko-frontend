# Serves the built SPA and proxies the API to the backend service on the Compose network, so the
# browser talks to one origin (the admin session cookie is SameSite=Strict, NFR-15).
server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;

  # Child request bodies are capped at 16 KB by the backend; uploads go up to 50 MB (NFR-17).
  client_max_body_size 51m;

  # On every response, proxied ones included. Locations declare no add_header of their own:
  # one there would drop these. The SPA has no inline script; styles may be inline (React style).
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The headers above come from this server; drop the backend's copies instead of sending two.
    proxy_hide_header X-Content-Type-Options;
  }

  # Hashed build output: a missing file is a 404, never the SPA page.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
  }

  location / {
    try_files $uri /index.html;
  }
}
