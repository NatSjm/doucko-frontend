# Serves the built SPA and proxies the API to the backend service on the Compose network, so the
# browser talks to one origin (the admin session cookie is SameSite=Strict, NFR-15).
# This file is included inside nginx's `http` block, so the directives before the servers apply to
# both of them, the 421 refusal included.

# On every response, proxied ones included. Servers and locations declare no add_header of their
# own: one there would drop these. The SPA has no inline script; styles may be inline (React style).
server_tokens off;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

# DNS rebinding guard: a website cannot point its own domain at this laptop and script the
# unauthenticated child API from the child's browser, because only localhost and bare IPv4
# addresses (127.0.0.1, the LAN address in DOUCKO_BIND_ADDRESS) are served. Any other Host gets 421.
server {
  listen 80 default_server;
  return 421;
}

server {
  listen 80;
  server_name localhost "~^[0-9]{1,3}(\.[0-9]{1,3}){3}$";
  root /usr/share/nginx/html;

  # Docker's embedded DNS. With a variable in proxy_pass, nginx looks "backend" up per request (cached
  # 10 s), so a recreated backend container (new IP) is found without restarting nginx, and nginx
  # starts even when the backend is not up yet.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Child request bodies are capped at 16 KB by the backend; uploads go up to 50 MB (NFR-17).
  client_max_body_size 51m;


  location /api/ {
    set $backend http://backend:8080;
    proxy_pass $backend;
    proxy_set_header Host $http_host;
    # nginx is the edge: overwrite, never append to, a client-supplied X-Forwarded-For, so the
    # backend's per-IP login throttling sees the real peer and cannot be spoofed.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The headers above come from this server; drop the backend's copies instead of sending two.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;
  }

  # /api without the slash is not an SPA page.
  location = /api {
    return 404;
  }

  # Hashed build output: a missing file is a 404, never the SPA page.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
  }

  # The SPA shell must never be cached: after a deploy it has to point at the new hashed assets.
  # (expires sets Cache-Control without a local header directive, so the http-level headers still apply.)
  location / {
    try_files $uri /index.html;
    expires -1;
  }
}
